global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: cloudnotes
    dns_sd_configs:
      - names: ["cloudnotes-metrics.observability-recovery.svc.cluster.local"]
        type: A
        port: 8081
        refresh_interval: 5s
